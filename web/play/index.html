<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111d"><title>Everdune — Play</title><style>html,body{height:100%;margin:0;background:#05080d;color:#f3e5c7;font-family:Georgia,serif}body{display:grid;place-items:center}.stage{width:min(1400px,96vw);height:min(800px,92vh);position:relative;border:1px solid #6d5234;background:#0a1118;box-shadow:0 0 0 2px #0d1115,0 24px 60px #0009;overflow:hidden}.stage iframe{width:100%;height:100%;border:0;display:block;background:#070b10}.gate{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#07111dcc,#05080def);z-index:2}.gate-card{max-width:520px;text-align:center;padding:34px;border:1px solid #7d5e39;background:linear-gradient(180deg,#172333,#0a1018);box-shadow:0 0 0 2px #0b0e12,0 18px 45px #0009}.gate h1{font-size:54px;margin:0;color:#efd49b}.gate p{color:#cbbd9f;line-height:1.5}.play{padding:13px 22px;border:1px solid #ba8a4b;background:#e6c383;color:#201911;font-weight:700;cursor:pointer}#status{margin-top:12px;font-size:12px;color:#978b79}@media(max-width:700px){.stage{width:100vw;height:100vh;border:0}.gate-card{margin:18px}.gate h1{font-size:42px}}</style></head><body><div class="stage"><iframe title="Everdune game" src="/game/index.html" allow="fullscreen" allowfullscreen></iframe><div class="gate" id="gate"><div class="gate-card"><div style="font-size:30px">✦</div><h1>Everdune</h1><p>The World Remembers.</p><p>Browser development build • Godot 4.7.2</p><button class="play" id="start">ENTER LARKMERE VALLEY</button><div id="status">Loading game shell…</div></div></div></div><script>const gate=document.getElementById('gate');const start=document.getElementById('start');start.addEventListener('click',async()=>{try{await document.documentElement.requestFullscreen?.()}catch(e){}gate.style.display='none'});const frame=document.querySelector('iframe');frame.addEventListener('load',()=>document.getElementById('status').textContent='Ready — click Enter to begin.');</script></body></html>
