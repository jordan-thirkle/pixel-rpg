name: Foundation checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify foundation
        run: |
          test -f README.md
          test -f docs/GENESIS.md
          test -f docs/PIXEL_ART_BIBLE.md
          test -f docs/TECHNICAL_FOUNDATION.md
          test -f docs/PRODUCTION_RULES.md
          test -f docs/STACK_LOCK.md
          test -f assets/ASSET_MANIFEST.json
          test -f game/project.godot
          test -f game/scenes/main.tscn
          test -f game/scripts/main.gd
          test -f game/scripts/game_state.gd
          test -f game/scripts/player.gd
          test -f game/scripts/ui.gd
          test -f game/scripts/save_system.gd
          test -f game/scripts/world_tiles.gd
          test -f game/scripts/gather_node.gd
          test -f game/scripts/weather.gd
          test -f game/scripts/audio.gd
          test -f game/scripts/enemy.gd
          test -f game/assets/terrain_atlas.svg
          test -f game/assets/props.svg
          test -f game/assets/player_body.svg
          test -f game/assets/player_hair.svg
          test -f game/assets/player_coat.svg
          test -f game/assets/hero_tools.svg
          test -f game/assets/hero_face.svg
          test -f game/assets/hero_shirt.svg
          test -f game/assets/hero_trousers.svg
          test -f game/assets/hero_boots.svg
          test -f game/assets/hero_accessory.svg
          test -f game/assets/hero_back.svg
          test -f game/assets/sleeping_gate.svg
          test -f game/assets/enemy_slime.svg
          test -f game/assets/environment_fx.svg
          test -f game/assets/water_anim.svg
          test -f game/assets/rain_overlay.svg
          test -f game/assets/light.svg
          python tools/validate_repo.py

      - name: Install pinned Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -name godot --perm -111 | head -n 1)"
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN="$(find /tmp/godot -type f -iname 'Godot_v*linux.x86_64' -perm -111 | head -n 1)"
          fi
          test -n "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Validate Godot project
        run: |
          "$GODOT_BIN" --headless --path game --editor --quit
          "$GODOT_BIN" --headless --path game --quit-after 3

      - name: Run deterministic regression suite
        run: |
          "$GODOT_BIN" --headless --path game --quit-after 10 --script tests/vertical_slice_test.gd
          "$GODOT_BIN" --headless --path game --quit-after 10 --script tests/save_migration_test.gd
          "$GODOT_BIN" --headless --path game --quit-after 10 --script tests/save_round_trip_test.gd
