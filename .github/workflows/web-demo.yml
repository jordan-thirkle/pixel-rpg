name: Browser demo

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          rm -rf /tmp/godot /tmp/templates
          mkdir -p /tmp/godot /tmp/templates
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          GODOT_BIN="$(find /tmp/godot -type f -name godot --perm -111 | head -n 1)"
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN="$(find /tmp/godot -type f -iname "Godot_v*linux.x86_64" -perm -111 | head -n 1)"
          fi
          test -n "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Validate and export Web demo
        run: |
          "$GODOT_BIN" --headless --path game --editor --quit
          rm -rf build/web
          mkdir -p build/web
          "$GODOT_BIN" --headless --path game --export-release "Web" ../build/web/index.html
          test -f build/web/index.html

      - name: Upload browser build artifact
        uses: actions/upload-artifact@v4
        with:
          name: everdune-web-demo
          path: build/web
          retention-days: 14

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
