<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>$GODOT_PROJECT_NAME</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110e;color:#f3ead2;font-family:Georgia,serif}
body{display:grid;place-items:center}
#canvas{width:100%;height:100%;display:block;image-rendering:auto}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:#07110e;z-index:10}
.card{width:min(520px,86vw);padding:34px 38px 30px;text-align:center;border:1px solid #a87f4d;background:linear-gradient(180deg,#15251e,#09120f);box-shadow:0 20px 70px #0009}
.mark{font-size:22px;color:#d7ad67;letter-spacing:8px}
h1{margin:8px 0 0;font-size:48px;letter-spacing:4px;color:#efd39a}
.sub{margin:4px 0 28px;font-size:12px;letter-spacing:3px;color:#bfae91}
.stage{font-size:12px;letter-spacing:2px;color:#e3c486;margin-bottom:12px}
.track{height:10px;background:#223229;border:1px solid #4e604f}
.fill{height:100%;width:0;background:#d1a35b;transition:width .08s linear}
.meta{display:flex;justify-content:space-between;margin-top:10px;font:12px monospace;color:#c6baa4}
.err{display:none;color:#e69c89;line-height:1.5;margin-top:14px}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="loader">
  <div class="card">
    <div class="mark">✦</div>
    <h1>EVERDUNE</h1>
    <div class="sub">THE WORLD REMEMBERS</div>
    <div class="stage" id="stage">LOADING GAME DATA</div>
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="meta"><span id="bytes">0 MB / —</span><strong id="pct">0%</strong></div>
    <div class="err" id="err"></div>
  </div>
</div>
<script src="$GODOT_URL"></script>
<script>
const stage=document.getElementById('stage'),fill=document.getElementById('fill'),pct=document.getElementById('pct'),bytes=document.getElementById('bytes'),err=document.getElementById('err');
const fmt=n=>n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(2)+' MB';
const engine=new Engine($GODOT_CONFIG);
engine.startGame({
  canvas:document.getElementById('canvas'),
  onProgress:(current,total)=>{
    if(total>0){
      const p=Math.max(0,Math.min(100,current/total*100));
      fill.style.width=p.toFixed(2)+'%'; pct.textContent=Math.round(p)+'%';
      bytes.textContent=fmt(current)+' / '+fmt(total);
    }else{
      fill.style.width='0%'; pct.textContent='—';
      bytes.textContent=fmt(current)+' / calculating';
    }
  },
  onPrintError:(message,description)=>{
    console.warn(message,description);
  }
}).then(()=>{
  stage.textContent='GAME ENGINE READY';
  fill.style.width='100%'; pct.textContent='100%';
  setTimeout(()=>document.getElementById('loader').style.display='none',120);
}).catch(e=>{
  stage.textContent='LOAD FAILED';
  err.style.display='block';
  err.textContent='Everdune could not start. '+(e?.message||e);
});
</script>
</body>
</html>
